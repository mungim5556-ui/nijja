# Cloudflare Worker(nijja-api) 자동 배포.
# main에서 proxy/ 또는 compare/(공법 비교 엔진)가 바뀌면 테스트 후 배포한다. Actions 탭에서 "Run workflow"로도 돌릴 수 있다.
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Workers Scripts 편집 + Workers KV 권한이 있는 API 토큰
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 계정 ID
#   RESULTS_KV_ID          결과 저장소 KV 네임스페이스 ID (Storage & Databases → KV)
# 비밀 변수(RESULTS_TOKEN, ANTHROPIC_API_KEY, DATA_GO_KR_KEY)는 Cloudflare에 이미 있고 배포해도 그대로 남는다.
name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "proxy/**"
      - "compare/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Worker 테스트 (가짜 KV)
        run: node scripts/test_worker.mjs

      - name: 공법 비교 엔진 테스트
        working-directory: compare
        run: node --test

      - name: 설정 확인
        id: cfg
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV: ${{ secrets.RESULTS_KV_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ] || [ -z "$KV" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, RESULTS_KV_ID Secrets가 없어 배포를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/$KV/" proxy/wrangler.toml
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 배포
        if: steps.cfg.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.157.0 deploy --config proxy/wrangler.toml
