# Cloudflare Worker 설정 (wrangler로 배포할 때). 대시보드에서 코드만 붙여 넣는다면 이 파일은 필요 없다.
# 배포: npx wrangler deploy --config proxy/wrangler.toml
name = "nijja-api"
main = "worker.js"
compatibility_date = "2026-11-01"

# 해체 분석 결과 저장소. id는 Cloudflare 대시보드(Storage & Databases → KV)에서 만든 네임스페이스의 ID로 바꾼다.
[[kv_namespaces]]
binding = "RESULTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# 비밀 변수는 파일에 쓰지 않는다:
#   npx wrangler secret put RESULTS_TOKEN --config proxy/wrangler.toml
# 기존 비밀 변수 DATA_GO_KR_KEY, ANTHROPIC_API_KEY는 그대로 둔다.
